<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    color: #e0e0e0;
  }

  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }

  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(18, 18, 28, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px 28px;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .divider {
    width: 1px;
    height: 32px;
    background: rgba(255, 255, 255, 0.1);
  }

  label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.5);
    white-space: nowrap;
  }

  input[type="number"] {
    width: 56px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 14px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  input[type="number"]:focus {
    border-color: rgba(120, 160, 255, 0.5);
  }

  button {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #5b7cfa, #8b5cf6);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(91, 124, 250, 0.35);
  }

  button:active {
    transform: translateY(0);
  }

  button.reset {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  button.reset:hover {
    background: rgba(255, 70, 70, 0.2);
    border-color: rgba(255, 70, 70, 0.3);
    box-shadow: none;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b7cfa, #8b5cf6);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(91, 124, 250, 0.4);
  }

  .gravity-value {
    font-size: 14px;
    font-weight: 600;
    min-width: 36px;
    text-align: right;
    color: #8b9cfa;
    font-variant-numeric: tabular-nums;
  }

  .stats {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }

  .floor-line {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent,
      rgba(91, 124, 250, 0.3) 20%,
      rgba(139, 92, 246, 0.3) 80%,
      transparent
    );
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="floor-line"></div>

<div class="stats" id="stats">0 balls</div>

<div class="controls">
  <div class="control-group">
    <label>Add</label>
    <input type="number" id="ballCount" value="5" min="1" max="100">
    <button id="addBtn">Drop</button>
  </div>

  <div class="divider"></div>

  <div class="control-group">
    <label>Gravity</label>
    <input type="range" id="gravitySlider" min="0.5" max="30" step="0.5" value="9.8">
    <span class="gravity-value" id="gravityValue">9.8</span>
  </div>

  <div class="divider"></div>

  <button class="reset" id="resetBtn">Clear</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');
const ballCountInput = document.getElementById('ballCount');
const addBtn = document.getElementById('addBtn');
const gravitySlider = document.getElementById('gravitySlider');
const gravityValueEl = document.getElementById('gravityValue');
const resetBtn = document.getElementById('resetBtn');

let W, H;
let balls = [];
let gravity = 9.8;
const SCALE = 80;
const BASE_RESTITUTION = 0.78;
const FRICTION = 0.995;
const FLOOR_FRICTION = 0.98;
const REST_THRESHOLD = 0.3;

const PALETTES = [
  ['#5b7cfa', '#7c9aff'],
  ['#8b5cf6', '#a78bfa'],
  ['#f472b6', '#f9a8d4'],
  ['#34d399', '#6ee7b7'],
  ['#fbbf24', '#fcd34d'],
  ['#f87171', '#fca5a5'],
  ['#60a5fa', '#93c5fd'],
  ['#a78bfa', '#c4b5fd'],
  ['#fb923c', '#fdba74'],
  ['#2dd4bf', '#5eead4'],
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function createBall(x) {
  const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const radius = 12 + Math.random() * 16;
  return {
    x: x !== undefined ? x : 40 + Math.random() * (W - 80),
    y: -radius - Math.random() * 200,
    vx: (Math.random() - 0.5) * 2,
    vy: Math.random() * 1.5,
    radius,
    color: palette[0],
    glow: palette[1],
    restitution: BASE_RESTITUTION + (Math.random() - 0.5) * 0.08,
    resting: false,
    trail: [],
  };
}

function addBalls(count) {
  const spread = Math.min(W - 80, count * 50);
  const startX = (W - spread) / 2;
  for (let i = 0; i < count; i++) {
    const x = count === 1
      ? W / 2 + (Math.random() - 0.5) * 100
      : startX + (spread * i / (count - 1)) + (Math.random() - 0.5) * 30;
    balls.push(createBall(x));
  }
}

// restitution drops slightly at extreme gravity
function effectiveRestitution(ball) {
  const gravityFactor = 1 - Math.max(0, (gravity - 9.8)) * 0.008;
  return ball.restitution * Math.max(0.5, gravityFactor);
}

function update(dt) {
  const g = gravity * SCALE;

  for (const ball of balls) {
    if (ball.resting) continue;

    ball.vy += g * dt;
    ball.vx *= FRICTION;
    ball.x += ball.vx * dt * SCALE;
    ball.y += ball.vy * dt * SCALE;

    // floor
    const floor = H - 2;
    if (ball.y + ball.radius > floor) {
      ball.y = floor - ball.radius;
      const e = effectiveRestitution(ball);
      ball.vy = -ball.vy * e;
      ball.vx *= FLOOR_FRICTION;

      if (Math.abs(ball.vy) < REST_THRESHOLD * SCALE * dt * 10) {
        ball.vy = 0;
        ball.y = floor - ball.radius;
        if (Math.abs(ball.vx) < 0.5) {
          ball.vx = 0;
          ball.resting = true;
        }
      }
    }

    // walls
    if (ball.x - ball.radius < 0) {
      ball.x = ball.radius;
      ball.vx = Math.abs(ball.vx) * effectiveRestitution(ball);
    } else if (ball.x + ball.radius > W) {
      ball.x = W - ball.radius;
      ball.vx = -Math.abs(ball.vx) * effectiveRestitution(ball);
    }

    // trail
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
  }

  // ball-to-ball collisions
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = a.radius + b.radius;

      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;

        const dvx = a.vx - b.vx;
        const dvy = a.vy - b.vy;
        const dvDotN = dvx * nx + dvy * ny;

        if (dvDotN > 0) {
          const e = Math.min(a.restitution, b.restitution);
          const impulse = dvDotN * (1 + e) * 0.5;
          a.vx -= impulse * nx;
          a.vy -= impulse * ny;
          b.vx += impulse * nx;
          b.vy += impulse * ny;
          a.resting = false;
          b.resting = false;
        }
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // subtle grid
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  for (let x = gridSize; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = gridSize; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  for (const ball of balls) {
    // trail
    if (ball.trail.length > 1 && !ball.resting) {
      for (let i = 1; i < ball.trail.length; i++) {
        const alpha = (i / ball.trail.length) * 0.15;
        const r = ball.radius * (i / ball.trail.length) * 0.6;
        ctx.beginPath();
        ctx.arc(ball.trail[i].x, ball.trail[i].y, r, 0, Math.PI * 2);
        ctx.fillStyle = ball.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
        ctx.fill();
      }
    }

    // glow
    const gradient = ctx.createRadialGradient(
      ball.x, ball.y, ball.radius * 0.2,
      ball.x, ball.y, ball.radius * 2.5
    );
    gradient.addColorStop(0, ball.glow + '30');
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // ball
    const ballGrad = ctx.createRadialGradient(
      ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.1,
      ball.x, ball.y, ball.radius
    );
    ballGrad.addColorStop(0, ball.glow);
    ballGrad.addColorStop(1, ball.color);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = ballGrad;
    ctx.fill();

    // highlight
    ctx.beginPath();
    ctx.arc(
      ball.x - ball.radius * 0.25,
      ball.y - ball.radius * 0.25,
      ball.radius * 0.35,
      0, Math.PI * 2
    );
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fill();
  }

  const active = balls.filter(b => !b.resting).length;
  statsEl.textContent = `${balls.length} ball${balls.length !== 1 ? 's' : ''}` +
    (active < balls.length ? ` · ${active} moving` : '');
}

let lastTime = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.033);
  lastTime = time;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// events
addBtn.addEventListener('click', () => {
  const count = Math.max(1, Math.min(100, parseInt(ballCountInput.value) || 1));
  addBalls(count);
});

gravitySlider.addEventListener('input', () => {
  gravity = parseFloat(gravitySlider.value);
  gravityValueEl.textContent = gravity.toFixed(1);
  // wake up resting balls when gravity changes
  for (const ball of balls) {
    if (ball.resting) {
      ball.resting = false;
      ball.vy = -0.1;
    }
  }
});

resetBtn.addEventListener('click', () => {
  balls = [];
});

// keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && document.activeElement !== ballCountInput) {
    e.preventDefault();
    const count = Math.max(1, Math.min(100, parseInt(ballCountInput.value) || 1));
    addBalls(count);
  }
});

// start with one ball
addBalls(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
