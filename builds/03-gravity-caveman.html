<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; }
  #controls {
    position: fixed; top: 16px; left: 16px;
    display: flex; gap: 12px; align-items: center;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    padding: 10px 16px;
    border-radius: 12px;
    z-index: 10;
  }
  #controls label { color: #aaa; font-size: 13px; }
  #controls input[type=range] {
    width: 100px; accent-color: #5bf;
    vertical-align: middle;
  }
  #controls span { color: #fff; font-size: 13px; min-width: 28px; }
  button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 13px;
    padding: 6px 14px; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.2); }
  #hint {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font-size: 13px;
    pointer-events: none;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
<div id="controls">
  <button id="addBtn">+ Ball</button>
  <button id="clearBtn">Clear</button>
  <label>Gravity</label>
  <input type="range" id="gravSlider" min="0.05" max="3" step="0.05" value="0.8">
  <span id="gravVal">0.8</span>
  <label>Bounce</label>
  <input type="range" id="bounceSlider" min="0.1" max="0.99" step="0.01" value="0.75">
  <span id="bounceVal">0.75</span>
  <label id="countLabel">Balls: 1</label>
</div>
<div id="hint">click anywhere to drop a ball</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const gravSlider = document.getElementById('gravSlider');
const gravVal = document.getElementById('gravVal');
const bounceSlider = document.getElementById('bounceSlider');
const bounceVal = document.getElementById('bounceVal');
const countLabel = document.getElementById('countLabel');
const hint = document.getElementById('hint');

let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const balls = [];
const colors = ['#5bf','#f5a','#5f8','#fa5','#a5f','#ff5','#5ff','#f55'];

function makeBall(x, y) {
  const r = 12 + Math.random() * 18;
  balls.push({
    x: x,
    y: y,
    vx: (Math.random() - 0.5) * 4,
    vy: 0,
    r: r,
    color: colors[balls.length % colors.length],
    trail: []
  });
  countLabel.textContent = 'Balls: ' + balls.length;
}

makeBall(W / 2, H * 0.2);

document.getElementById('addBtn').addEventListener('click', () => {
  makeBall(60 + Math.random() * (W - 120), 40 + Math.random() * 60);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  balls.length = 0;
  makeBall(W / 2, H * 0.2);
});

canvas.addEventListener('click', (e) => {
  makeBall(e.clientX, e.clientY);
  hint.style.opacity = '0';
});

gravSlider.addEventListener('input', () => {
  gravVal.textContent = gravSlider.value;
});
bounceSlider.addEventListener('input', () => {
  bounceVal.textContent = bounceSlider.value;
});

function update() {
  const gravity = parseFloat(gravSlider.value);
  const restitution = parseFloat(bounceSlider.value);
  const friction = 0.995;

  for (const b of balls) {
    b.vy += gravity;
    b.vx *= friction;
    b.x += b.vx;
    b.y += b.vy;

    // floor
    if (b.y + b.r > H) {
      b.y = H - b.r;
      b.vy *= -restitution;
      b.vx *= 0.98;
      if (Math.abs(b.vy) < 0.5) b.vy = 0;
    }

    // walls
    if (b.x - b.r < 0) {
      b.x = b.r;
      b.vx *= -restitution;
    }
    if (b.x + b.r > W) {
      b.x = W - b.r;
      b.vx *= -restitution;
    }

    // ceiling
    if (b.y - b.r < 0) {
      b.y = b.r;
      b.vy *= -restitution;
    }

    // ball-ball collisions
    for (const o of balls) {
      if (o === b) continue;
      const dx = o.x - b.x;
      const dy = o.y - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = b.r + o.r;
      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        b.x -= nx * overlap * 0.5;
        b.y -= ny * overlap * 0.5;
        o.x += nx * overlap * 0.5;
        o.y += ny * overlap * 0.5;
        const dvx = b.vx - o.vx;
        const dvy = b.vy - o.vy;
        const dot = dvx * nx + dvy * ny;
        if (dot > 0) {
          b.vx -= dot * nx * restitution;
          b.vy -= dot * ny * restitution;
          o.vx += dot * nx * restitution;
          o.vy += dot * ny * restitution;
        }
      }
    }

    // trail
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.shift();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const b of balls) {
    // trail
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const alpha = (i / b.trail.length) * 0.25;
      const size = b.r * (i / b.trail.length) * 0.6;
      ctx.beginPath();
      ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
      ctx.fillStyle = b.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
      ctx.fill();
    }

    // ball
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, b.color);
    grad.addColorStop(1, b.color + '44');
    ctx.fillStyle = grad;
    ctx.fill();

    // shadow
    ctx.beginPath();
    ctx.ellipse(b.x, H - 4, b.r * 0.7, 4, 0, 0, Math.PI * 2);
    const shadowAlpha = Math.max(0, 0.15 * (1 - (H - b.y) / H));
    ctx.fillStyle = `rgba(255,255,255,${shadowAlpha})`;
    ctx.fill();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
