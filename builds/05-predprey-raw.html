<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predator–Prey Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0b0e14;color:#c8ccd4;overflow:hidden;height:100vh}
#app{display:grid;grid-template-columns:1fr 300px;height:100vh}
#world{position:relative;background:#0c1018;overflow:hidden}
#sim{display:block;width:100%;height:100%}
#hud{position:absolute;top:14px;left:14px;display:flex;gap:10px;pointer-events:none}
.pop{padding:5px 14px;border-radius:20px;background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pop.rabbits{color:#6ee7b7}
.pop.foxes{color:#fb923c}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 28px;border-radius:12px;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);color:#f1f5f9;font-size:15px;font-weight:600;pointer-events:none;opacity:0;transition:opacity 0.4s}
#toast.show{opacity:1}
#panel{display:flex;flex-direction:column;gap:18px;padding:20px;background:#111620;border-left:1px solid #1a1f2e;overflow-y:auto}
h1{font-size:16px;font-weight:700;color:#e2e8f0;letter-spacing:.3px}
.control{display:flex;flex-direction:column;gap:6px}
.control label{display:flex;justify-content:space-between;font-size:12px;color:#7b8394}
.control label span{color:#cbd5e1;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:#1c2333;border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#6366f1;cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#6366f1;cursor:pointer;border:none}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
#toggle{background:#6366f1;color:#fff}
#toggle:hover{background:#818cf8}
#toggle.paused{background:#22c55e}
#reset{background:#1c2333;color:#8892a4}
#reset:hover{background:#273044}
#graph-wrap{flex:1;min-height:130px;border-radius:8px;overflow:hidden;background:#0d1119}
#graph{display:block;width:100%;height:100%}
#legend{display:flex;gap:16px;font-size:11px;font-weight:500}
.leg-r{color:#22c55e}
.leg-f{color:#f97316}
@media(max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr 260px}
  #panel{border-left:none;border-top:1px solid #1a1f2e}
}
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <canvas id="sim"></canvas>
    <div id="hud">
      <div class="pop rabbits">Rabbits <span id="rc">0</span></div>
      <div class="pop foxes">Foxes <span id="fc">0</span></div>
    </div>
    <div id="toast"></div>
  </div>
  <aside id="panel">
    <h1>Predator · Prey</h1>
    <div class="control">
      <label>Rabbit Breeding Rate <span id="br-val">0.8%</span></label>
      <input type="range" id="breed-rate" min="1" max="40" value="8">
    </div>
    <div class="control">
      <label>Ecosystem Capacity <span id="cap-val">400</span></label>
      <input type="range" id="capacity" min="50" max="800" value="400" step="10">
    </div>
    <div class="btns">
      <button id="toggle">Pause</button>
      <button id="reset">Reset</button>
    </div>
    <div id="graph-wrap"><canvas id="graph"></canvas></div>
    <div id="legend"><span class="leg-r">● Rabbits</span> <span class="leg-f">● Foxes</span></div>
  </aside>
</div>
<script>
const CFG = {
  rabbitSpeed: 1.5,
  rabbitBreedRate: 0.008,
  rabbitBreedCooldown: 50,
  foxSpeed: 2.2,
  foxDetectRange: 150,
  foxKillRange: 12,
  foxChaseAccel: 0.35,
  foxEnergyStart: 80,
  foxMaxEnergy: 200,
  foxEnergyDecay: 0.15,
  foxEnergyGain: 50,
  foxBreedThreshold: 100,
  foxBreedCost: 50,
  foxBreedCooldown: 80,
  capacity: 400,
  maxRabbits: 800,
  maxFoxes: 400,
  initRabbits: 60,
  initFoxes: 12,
  historyLen: 600,
  historyInterval: 3
};

const state = { rabbits: [], foxes: [], paused: false, tick: 0, history: { r: [], f: [] } };

const simCanvas = document.getElementById('sim');
const simCtx = simCanvas.getContext('2d');
const graphCanvas = document.getElementById('graph');
const graphCtx = graphCanvas.getContext('2d');
const rcEl = document.getElementById('rc');
const fcEl = document.getElementById('fc');
const toastEl = document.getElementById('toast');
const toggleBtn = document.getElementById('toggle');
const resetBtn = document.getElementById('reset');
const breedSlider = document.getElementById('breed-rate');
const capSlider = document.getElementById('capacity');
const brValEl = document.getElementById('br-val');
const capValEl = document.getElementById('cap-val');

let simW, simH, graphW, graphH, toastTimer;
const dpr = window.devicePixelRatio || 1;

function sizeCanvas(canvas, ctx, container) {
  const r = container.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [r.width, r.height];
}

function resize() {
  [simW, simH] = sizeCanvas(simCanvas, simCtx, simCanvas.parentElement);
  [graphW, graphH] = sizeCanvas(graphCanvas, graphCtx, graphCanvas.parentElement);
}

function mkRabbit(x, y) {
  return { x, y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, cd: 0 };
}

function mkFox(x, y) {
  return { x, y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, energy: CFG.foxEnergyStart, cd: CFG.foxBreedCooldown };
}

function toast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function init() {
  state.rabbits = [];
  state.foxes = [];
  state.tick = 0;
  state.history = { r: [], f: [] };
  state.paused = false;
  toggleBtn.textContent = 'Pause';
  toggleBtn.classList.remove('paused');
  toastEl.classList.remove('show');
  for (let i = 0; i < CFG.initRabbits; i++) state.rabbits.push(mkRabbit(Math.random() * simW, Math.random() * simH));
  for (let i = 0; i < CFG.initFoxes; i++) state.foxes.push(mkFox(Math.random() * simW, Math.random() * simH));
}

function step() {
  const W = simW, H = simH;
  const prevR = state.rabbits.length;
  const prevF = state.foxes.length;

  const babies = [];
  for (const r of state.rabbits) {
    r.vx += (Math.random() - 0.5) * 0.6;
    r.vy += (Math.random() - 0.5) * 0.6;
    let sp = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
    if (sp > CFG.rabbitSpeed) { r.vx *= CFG.rabbitSpeed / sp; r.vy *= CFG.rabbitSpeed / sp; }
    r.x += r.vx; r.y += r.vy;
    if (r.x < 0) { r.x = 0; r.vx = Math.abs(r.vx); }
    if (r.x > W) { r.x = W; r.vx = -Math.abs(r.vx); }
    if (r.y < 0) { r.y = 0; r.vy = Math.abs(r.vy); }
    if (r.y > H) { r.y = H; r.vy = -Math.abs(r.vy); }

    if (r.cd > 0) r.cd--;
    if (r.cd <= 0) {
      const rate = CFG.rabbitBreedRate * Math.max(0, 1 - state.rabbits.length / CFG.capacity);
      if (rate > 0 && Math.random() < rate) {
        babies.push(mkRabbit(
          Math.max(0, Math.min(W, r.x + (Math.random() - 0.5) * 30)),
          Math.max(0, Math.min(H, r.y + (Math.random() - 0.5) * 30))
        ));
        r.cd = CFG.rabbitBreedCooldown;
      }
    }
  }
  for (let i = 0; i < babies.length && state.rabbits.length < CFG.maxRabbits; i++) {
    state.rabbits.push(babies[i]);
  }

  const eaten = new Set();
  const foxBabies = [];
  for (const f of state.foxes) {
    f.energy -= CFG.foxEnergyDecay;

    let bestI = -1, bestD = CFG.foxDetectRange;
    for (let i = 0; i < state.rabbits.length; i++) {
      if (eaten.has(i)) continue;
      const dx = state.rabbits[i].x - f.x, dy = state.rabbits[i].y - f.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; bestI = i; }
    }

    if (bestI >= 0) {
      const prey = state.rabbits[bestI];
      const dx = prey.x - f.x, dy = prey.y - f.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      f.vx += (dx / d) * CFG.foxChaseAccel;
      f.vy += (dy / d) * CFG.foxChaseAccel;
      if (bestD < CFG.foxKillRange) {
        eaten.add(bestI);
        f.energy = Math.min(f.energy + CFG.foxEnergyGain, CFG.foxMaxEnergy);
      }
    } else {
      f.vx += (Math.random() - 0.5) * 0.5;
      f.vy += (Math.random() - 0.5) * 0.5;
    }

    let sp = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
    if (sp > CFG.foxSpeed) { f.vx *= CFG.foxSpeed / sp; f.vy *= CFG.foxSpeed / sp; }
    f.x += f.vx; f.y += f.vy;
    if (f.x < 0) { f.x = 0; f.vx = Math.abs(f.vx); }
    if (f.x > W) { f.x = W; f.vx = -Math.abs(f.vx); }
    if (f.y < 0) { f.y = 0; f.vy = Math.abs(f.vy); }
    if (f.y > H) { f.y = H; f.vy = -Math.abs(f.vy); }

    if (f.cd > 0) f.cd--;
    if (f.energy > CFG.foxBreedThreshold && f.cd <= 0 && state.foxes.length + foxBabies.length < CFG.maxFoxes) {
      foxBabies.push(mkFox(
        Math.max(0, Math.min(W, f.x + (Math.random() - 0.5) * 30)),
        Math.max(0, Math.min(H, f.y + (Math.random() - 0.5) * 30))
      ));
      f.energy -= CFG.foxBreedCost;
      f.cd = CFG.foxBreedCooldown;
    }
  }

  state.rabbits = state.rabbits.filter((_, i) => !eaten.has(i));
  state.foxes = state.foxes.filter(f => f.energy > 0);
  state.foxes.push(...foxBabies);

  state.tick++;
  if (state.tick % CFG.historyInterval === 0) {
    state.history.r.push(state.rabbits.length);
    state.history.f.push(state.foxes.length);
    if (state.history.r.length > CFG.historyLen) { state.history.r.shift(); state.history.f.shift(); }
  }

  if (state.rabbits.length === 0 && prevR > 0) toast('Rabbits went extinct');
  if (state.foxes.length === 0 && prevF > 0) toast('Foxes went extinct');
}

function drawSim() {
  const ctx = simCtx;
  ctx.fillStyle = 'rgba(12,16,24,0.82)';
  ctx.fillRect(0, 0, simW, simH);

  ctx.fillStyle = '#c8d8c0';
  for (const r of state.rabbits) {
    ctx.beginPath();
    ctx.arc(r.x, r.y, 3, 0, 6.283);
    ctx.fill();
  }

  for (const f of state.foxes) {
    const er = Math.min(1, f.energy / CFG.foxMaxEnergy);
    ctx.fillStyle = `rgb(${180 + 60 * er | 0},${50 + 65 * er | 0},${20 + 50 * er | 0})`;
    const angle = Math.atan2(f.vy, f.vx);
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 3.5, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

function drawGraph() {
  const ctx = graphCtx;
  const W = graphW, H = graphH;
  const pad = { t: 8, r: 8, b: 4, l: 36 };
  const pW = W - pad.l - pad.r, pH = H - pad.t - pad.b;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1119';
  ctx.fillRect(0, 0, W, H);

  const rD = state.history.r, fD = state.history.f;
  if (rD.length < 2) return;

  const rawMax = Math.max(20, ...rD, ...fD);
  const maxY = Math.ceil(rawMax / 50) * 50 || 50;
  const yScale = pH / maxY;
  const xStep = pW / (CFG.historyLen - 1);

  ctx.strokeStyle = '#171d2a';
  ctx.lineWidth = 1;
  ctx.font = '10px system-ui';
  ctx.fillStyle = '#444c5c';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + pH * (1 - i / 4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(Math.round(maxY * i / 4), pad.l - 4, y + 3);
  }

  function drawLine(data, stroke, fill) {
    const startX = pad.l + (CFG.historyLen - data.length) * xStep;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(startX, pad.t + pH);
    for (let i = 0; i < data.length; i++) ctx.lineTo(startX + i * xStep, pad.t + pH - data[i] * yScale);
    ctx.lineTo(startX + (data.length - 1) * xStep, pad.t + pH);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = startX + i * xStep, y = pad.t + pH - data[i] * yScale;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  drawLine(rD, '#22c55e', 'rgba(34,197,94,0.08)');
  drawLine(fD, '#f97316', 'rgba(249,115,22,0.08)');
}

function loop() {
  if (!state.paused) step();
  drawSim();
  if (state.tick % 3 === 0) drawGraph();
  rcEl.textContent = state.rabbits.length;
  fcEl.textContent = state.foxes.length;
  requestAnimationFrame(loop);
}

breedSlider.addEventListener('input', () => {
  CFG.rabbitBreedRate = breedSlider.value / 1000;
  brValEl.textContent = (CFG.rabbitBreedRate * 100).toFixed(1) + '%';
});

capSlider.addEventListener('input', () => {
  CFG.capacity = +capSlider.value;
  capValEl.textContent = capSlider.value;
});

toggleBtn.addEventListener('click', () => {
  state.paused = !state.paused;
  toggleBtn.textContent = state.paused ? 'Resume' : 'Pause';
  toggleBtn.classList.toggle('paused', state.paused);
});

resetBtn.addEventListener('click', () => {
  simCtx.clearRect(0, 0, simW, simH);
  init();
});

window.addEventListener('resize', resize);
resize();
init();
requestAnimationFrame(loop);
</script>
</body>
</html>
